name: update
on:
  schedule:
    - cron: "0 8 * * 1,2"   # lundi et mardi, 8 h UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Recalculer même sans nouvelle manche"
        type: boolean
        default: false
permissions: {}
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.run.outputs.updated }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.13.0"
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run pytest -q
      - id: run
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            uv run python -m f1pred run --force
          else
            uv run python -m f1pred run
          fi
      - name: Commit des données
        if: steps.run.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: mise à jour après la dernière manche"
          git pull --rebase "$remote" "$GITHUB_REF_NAME"
          git push "$remote" "HEAD:$GITHUB_REF_NAME"
      - name: Keepalive (GitHub coupe le cron après 60 jours sans commit)
        if: steps.run.outputs.updated != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$age_days" -gt 45 ]; then
            remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git pull --rebase "$remote" "$GITHUB_REF_NAME"
            git push "$remote" "HEAD:$GITHUB_REF_NAME"
          fi
      - if: steps.run.outputs.updated == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.updated == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
