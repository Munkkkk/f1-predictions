[project]
name = "f1pred"
version = "0.1.0"
description = "Probabilités de titre mondial F1 (LightGBM + Monte Carlo)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "requests>=2.31",
    "jinja2>=3.1",
    "plotly>=5.20",
    "pyarrow>=15",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f1pred"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
